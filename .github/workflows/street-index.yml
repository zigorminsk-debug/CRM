name: Индекс адресов (улицы и дома из OSM)

on:
  workflow_dispatch:
  schedule:
    - cron: "0 4 1 * *"   # раз в месяц, 1-го числа
  push:
    paths:
      - "tools/build_street_index.py"   # ручной запуск: любое изменение сборщика

permissions:
  contents: write

jobs:
  build:
    name: Сборка справочника улиц и домов
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Сбор данных из OpenStreetMap (Overpass)
        run: |
          set +e
          python3 tools/build_street_index.py > harvest.log 2>&1
          echo $? > harvest.exit
          cat harvest.log
          test "$(cat harvest.exit)" = "0"
        env:
          PYTHONUNBUFFERED: "1"
      - name: "Диагностика — лог в репозиторий при сбое"
        if: failure()
        run: |
          git config user.name "crm-index-bot"
          git config user.email "actions@users.noreply.github.com"
          mkdir -p .ci
          { cat harvest.log; echo "exit=$(cat harvest.exit)"; } > .ci/last-harvest.log
          git add .ci/last-harvest.log
          git commit -m "street-index: harvest failed - log attached"
          git push
      - name: Коммит обновлённого справочника
        run: |
          git config user.name "crm-index-bot"
          git config user.email "actions@users.noreply.github.com"
          git add server/app/data/minsk_streets.csv server/app/data/minsk_houses.csv.gz .ci/harvest-report.txt
          git rm --cached -q server/app/data/minsk_houses.csv.gz.placeholder 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Данные не изменились"
            exit 0
          fi
          git commit -m "Address index refresh from OpenStreetMap (streets + houses, ODbL)" -m "Auto-generated by street-index workflow on $(date -u '+%Y-%m-%d'). Data (c) OpenStreetMap contributors, ODbL 1.0."
          git push
